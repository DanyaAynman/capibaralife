<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Своя игра</title><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><style>:root{--g:#ffd44d;--m:#9fb0d4;--b:#31538f;--ok:#2dd66f;--bad:#ff5a68}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#12306b,#071026 46%,#030714);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{min-height:100vh;padding:16px}.wrap{max-width:1180px;margin:auto}.brand{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.logo{font-size:clamp(24px,5vw,38px);font-weight:950;letter-spacing:.08em}.logo span{color:var(--g)}.status{font-size:13px;color:var(--m);text-align:right}.card{background:linear-gradient(180deg,#10234e,#0a1837);border:1px solid #28477e;border-radius:22px;padding:22px;box-shadow:0 18px 55px #0008}.hidden{display:none!important}.hero,.join,.waiting{max-width:720px;margin:7vh auto 0;text-align:center}.hero h1{font-size:clamp(38px,8vw,72px);line-height:.95}.tiny{color:var(--m);line-height:1.5}.btn{border:0;border-radius:15px;padding:13px 18px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,#2e70ff,#764cff);color:#fff}.gold{background:linear-gradient(135deg,#ffd44d,#f6a800);color:#1c1805}.ghost{background:#122653;color:#dfe8ff;border:1px solid var(--b)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.field{width:100%;margin:8px 0;padding:15px;border-radius:14px;border:1px solid var(--b);background:#081633;color:#fff;font-size:18px}.roomBox{margin:18px 0;padding:17px;border:1px dashed #5578bd;border-radius:18px;background:#07132d}.roomCode{font-size:clamp(40px,10vw,78px);font-weight:950;letter-spacing:.16em;color:var(--g)}.share{font-size:13px;color:#b7c7e7;word-break:break-all}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin:14px 0}.playerCard{padding:12px;border:1px solid var(--b);border-radius:15px;background:#0a1734}.playerCard.active{border-color:var(--g);box-shadow:0 0 0 2px #ffd44d22}.score{font-size:24px;color:var(--g);font-weight:900}.turn{margin:10px 0 14px;padding:10px 14px;border-radius:13px;background:#0b1d43;border:1px solid #355995;color:#dbe6ff;font-weight:800}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.cat,.cell{border-radius:10px;text-align:center}.cat{background:#102858;border:1px solid #315b9f;padding:10px 3px;min-height:56px;display:flex;align-items:center;justify-content:center;font-weight:900;text-transform:uppercase;font-size:clamp(9px,1.3vw,15px)}.cell{background:linear-gradient(#103481,#0a2a70);border:1px solid #2f66c8;color:var(--g);font-weight:950;font-size:clamp(18px,3vw,34px);min-height:70px}.cell.used{opacity:.18;color:transparent;pointer-events:none}.cell.locked{opacity:.55;pointer-events:none}.questionBox{max-width:850px;margin:16px auto;text-align:center}.qMeta{color:var(--g);font-weight:900}.qText{font-size:clamp(28px,5vw,54px);font-weight:900;line-height:1.16;margin:24px 0}.timer{font-size:44px;font-weight:950;color:var(--g)}.answerRow{display:flex;gap:9px;max-width:680px;margin:16px auto}.answerRow input{flex:1;margin:0}.msg{min-height:30px;font-size:18px;font-weight:850;margin:12px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}.answerReveal{margin:14px auto;padding:14px;border-radius:14px;background:#0f2a55;border:1px solid #345f9d;max-width:700px;font-size:22px}.notice{margin-top:12px;padding:12px;border-radius:14px;background:#0b1d43;border:1px solid #355995;color:#cbd8f4;font-size:13px;line-height:1.45}@media(max-width:760px){.app{padding:12px}.card{padding:17px}.cell{min-height:58px}.cat{min-height:48px}.answerRow{flex-direction:column}.answerRow .btn{width:100%}}</style></head><body><div class="app"><div class="wrap"><div class="brand"><div class="logo">СВОЯ <span>ИГРА</span></div><div id="netStatus" class="status">готово</div></div>
<section id="home" class="card hero"><div class="tiny">Мультиплеерная викторина</div><h1>Своя игра<br>для компании</h1><input id="creatorName" class="field" maxlength="18" placeholder="Ваше имя"><div class="row" style="justify-content:center"><button id="createBtn" class="btn gold">Создать игру</button><button id="joinManualBtn" class="btn ghost">Подключиться</button></div></section>
<section id="lobby" class="card hidden"><div class="tiny">Комната игры</div><h2>Отправьте ссылку другим игрокам</h2><div class="roomBox"><div class="tiny">КОД КОМНАТЫ</div><div id="roomCode" class="roomCode">----</div><div id="shareLink" class="share"></div></div><div class="row"><button id="copyBtn" class="btn primary">Скопировать ссылку</button><button id="shareBtn" class="btn ghost">Поделиться</button></div><h3>Игроки</h3><div id="lobbyPlayers" class="players"></div><button id="startBtn" class="btn gold" disabled>Начать игру</button><div class="tiny" style="margin-top:10px">Первый вопрос выбирает создатель комнаты.</div></section>
<section id="join" class="card join hidden"><div class="tiny">Подключение к игре</div><h2>Введите имя</h2><input id="joinName" class="field" maxlength="18" placeholder="Например: Марго"><input id="roomInput" class="field" maxlength="6" inputmode="numeric" placeholder="Код комнаты"><button id="connectBtn" class="btn primary">Подключиться</button><div id="joinMsg" class="notice">Откройте ссылку в Safari.</div></section>
<section id="waiting" class="card waiting hidden"><h2>Вы подключены</h2><p>Ждём начала игры…</p><div id="waitingPlayers" class="players"></div></section>
<section id="play" class="hidden"><div id="turnInfo" class="turn"></div><div id="scoreboard" class="players"></div><div id="boardWrap" class="card"><div id="boardTitle" class="tiny">Игровое поле</div><div id="board" class="board"></div></div><div id="questionWrap" class="card questionBox hidden"><div id="qMeta" class="qMeta"></div><div id="qText" class="qText"></div><div id="qTimer" class="timer">20</div><div id="answerRow" class="answerRow"><input id="answerInput" class="field" maxlength="80" autocomplete="off" placeholder="Введите ответ"><button id="answerBtn" class="btn primary">Ответить</button></div><div id="answerMsg" class="msg"></div><div id="answerReveal" class="answerReveal hidden"></div></div></section>
</div></div><script>
const $=s=>document.querySelector(s),qs=new URLSearchParams(location.search),roomFromUrl=(qs.get('room')||'').replace(/\D/g,'').slice(0,6);const OPTS={host:'0.peerjs.com',port:443,path:'/',secure:true,debug:1,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
let role=(qs.get('join')==='1'||roomFromUrl)?'guest':'creator',peer=null,hostConn=null,room='',localId='',localName='',players=new Map(),used=new Set(),chooser=null,current=null,questionOpen=false,answered=new Set(),timerId=null,timeLeft=20;
const Q=[{cat:'Кино',items:[[100,'Кто сыграл Железного человека?','Роберт Дауни младший|Роберт Дауни'],[200,'Как называется школа волшебства Гарри Поттера?','Хогвартс'],[300,'Кто режиссёр фильма «Интерстеллар»?','Кристофер Нолан|Нолан'],[400,'Как называется первый фильм с Джеком Воробьём?','Пираты Карибского моря Проклятие Черной жемчужины|Проклятие Черной жемчужины'],[500,'Какой фильм получил «Оскар» за лучший фильм в 2020 году?','Паразиты']]},{cat:'История',items:[[100,'Кто был первым императором Рима?','Октавиан Август|Август'],[200,'В каком году началась Вторая мировая война?','1939'],[300,'Как назывался торговый путь из Китая в Европу?','Великий шелковый путь|Шелковый путь'],[400,'Кто победил в битве при Ватерлоо?','Коалиция Веллингтона и Блюхера|Веллингтон и Блюхер'],[500,'Столица Византийской империи?','Константинополь']]},{cat:'География',items:[[100,'Столица Италии?','Рим'],[200,'Какой океан самый большой?','Тихий океан|Тихий'],[300,'Какая река протекает через Париж?','Сена'],[400,'Какое государство полностью окружено территорией ЮАР?','Лесото'],[500,'Какой пролив разделяет Азию и Северную Америку?','Берингов пролив|Берингов']]},{cat:'Наука',items:[[100,'Как называется спутник Земли?','Луна'],[200,'Какой газ растения поглощают при фотосинтезе?','Углекислый газ|Диоксид углерода|CO2'],[300,'Химический символ золота?','Au'],[400,'Сколько хромосом обычно у человека?','46'],[500,'Как называется граница вокруг чёрной дыры?','Горизонт событий']]},{cat:'Игры',items:[[100,'Главный герой Resident Evil 4?','Леон Кеннеди|Леон С Кеннеди|Леон'],[200,'Как зовут водопроводчика Nintendo?','Марио'],[300,'Какая компания создала PlayStation?','Sony|Сони'],[400,'В какой серии игр есть Раккун-Сити?','Resident Evil|Резидент Ивел'],[500,'Кто главный герой The Witcher 3?','Геральт|Геральт из Ривии']]},{cat:'Разное',items:[[100,'Сколько минут в одном часе?','60|шестьдесят'],[200,'Какой металл жидкий при комнатной температуре?','Ртуть'],[300,'Самая высокая гора Земли над уровнем моря?','Эверест|Джомолунгма'],[400,'Какой язык имеет больше всего носителей как родной?','Китайский|Мандарин|Китайский мандарин'],[500,'Как называется боязнь замкнутых пространств?','Клаустрофобия']]}];
function show(id){['home','lobby','join','waiting','play'].forEach(x=>$('#'+x).classList.add('hidden'));$('#'+id).classList.remove('hidden')}function setNet(t){$('#netStatus').textContent=t}function rid(c){return 'svoya-'+c}function makeRoom(){return String(Math.floor(1000+Math.random()*9000))}function k(ci,ri){return ci+'-'+ri}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}function norm(s){return String(s).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/gi,' ').trim()}function correct(given,accepted){const g=norm(given);if(!g)return false;return accepted.split('|').some(a=>{const n=norm(a);return g===n||(g.length>=4&&n.length>=4&&(g.includes(n)||n.includes(g)))})}function allPlayers(){const arr=[];if(role==='creator'&&localName)arr.push({id:'creator',name:localName,score:players.get('creator')?.score||0});for(const [id,p] of players)if(id!=='creator')arr.push({id,name:p.name,score:p.score});return arr}function renderPlayers(){const arr=allPlayers();for(const sel of ['#lobbyPlayers','#waitingPlayers','#scoreboard']){const el=$(sel);el.innerHTML='';arr.forEach(p=>{const d=document.createElement('div');d.className='playerCard'+(p.id===chooser?' active':'');d.innerHTML='<b>'+esc(p.name)+'</b><div class="score">'+p.score+'</div>';el.appendChild(d)})}if(role==='creator')$('#startBtn').disabled=arr.length<2}function state(){return{type:'state',players:allPlayers(),used:[...used],chooser}}function sendAll(m){players.forEach((p,id)=>{if(id!=='creator'&&p.conn)try{p.conn.send(m)}catch(e){}})}function sync(){renderPlayers();if(role==='creator')sendAll(state())}function setScore(id,val){if(id==='creator'){let p=players.get('creator')||{name:localName,score:0};p.score=val;players.set('creator',p)}else if(players.has(id))players.get(id).score=val}function getScore(id){return players.get(id)?.score||0}function getName(id){if(id==='creator')return localName;return players.get(id)?.name||'Игрок'}
function createRoom(){localName=$('#creatorName').value.trim();if(!localName)return;room=makeRoom();localId='creator';players.clear();players.set('creator',{name:localName,score:0});chooser='creator';$('#roomCode').textContent=room;$('#shareLink').textContent=location.origin+location.pathname+'?join=1&room='+room;show('lobby');renderPlayers();setNet('создаю комнату…');peer=new Peer(rid(room),OPTS);peer.on('open',()=>setNet('комната '+room+' онлайн'));peer.on('connection',c=>{c.on('data',d=>creatorData(c,d));c.on('close',()=>{players.delete(c.peer);sync()})});peer.on('error',e=>setNet('ошибка: '+(e.type||'network'))}
function creatorData(c,d){if(!d||!d.type)return;if(d.type==='hello'){players.set(c.peer,{name:(d.name||'Игрок').slice(0,18),score:0,conn:c});c.send({type:'welcome',id:c.peer});sync()}else if(d.type==='select'&&chooser===c.peer&&!questionOpen)selectQuestion(+d.ci,+d.ri);else if(d.type==='answer')processAnswer(c.peer,d.answer)}
function connect(){localName=$('#joinName').value.trim();room=($('#roomInput').value||roomFromUrl).replace(/\D/g,'').slice(0,6);if(!localName||!room)return;$('#joinMsg').textContent='Подключение…';peer=new Peer(undefined,OPTS);peer.on('open',()=>{localId=peer.id;hostConn=peer.connect(rid(room),{reliable:true});hostConn.on('open',()=>hostConn.send({type:'hello',name:localName}));hostConn.on('data',guestData)});peer.on('error',e=>$('#joinMsg').textContent='Ошибка: '+(e.type||'network'))}
function guestData(d){if(!d||!d.type)return;if(d.type==='welcome'){show('waiting');setNet('подключено к комнате '+room)}if(d.type==='state'){players.clear();d.players.forEach(p=>players.set(p.id,{name:p.name,score:p.score}));used=new Set(d.used||[]);chooser=d.chooser;renderPlayers();renderBoard()}if(d.type==='gameStart'){show('play');chooser=d.chooser;used=new Set(d.used||[]);renderBoard();updateTurn()}if(d.type==='question')showQuestion(d);if(d.type==='answerResult')handleAnswerResult(d);if(d.type==='turn'){questionOpen=false;chooser=d.chooser;used=new Set(d.used||[]);$('#questionWrap').classList.add('hidden');$('#boardWrap').classList.remove('hidden');$('#answerMsg').textContent='';renderBoard();updateTurn()}if(d.type==='scoreState'){d.players.forEach(p=>{if(players.has(p.id)){players.get(p.id).score=p.score}else players.set(p.id,{name:p.name,score:p.score})});chooser=d.chooser;renderPlayers()}}
function startGame(){show('play');chooser='creator';renderBoard();updateTurn();sendAll({type:'gameStart',chooser,used:[...used]});sync()}
function renderBoard(){const b=$('#board');b.innerHTML='';Q.forEach(c=>{const h=document.createElement('div');h.className='cat';h.textContent=c.cat;b.appendChild(h)});for(let r=0;r<5;r++)Q.forEach((c,ci)=>{const x=document.createElement('button');const can=localId===chooser&&!questionOpen;x.className='cell'+(used.has(k(ci,r))?' used':(!can?' locked':''));x.textContent=c.items[r][0];x.onclick=()=>{if(!can||used.has(k(ci,r)))return;if(role==='creator')selectQuestion(ci,r);else hostConn.send({type:'select',ci,ri:r})};b.appendChild(x)})}
function updateTurn(){const mine=localId===chooser;$('#turnInfo').textContent=mine?'Ваш ход — выберите следующий вопрос':'Сейчас выбирает '+getName(chooser);renderPlayers()}
function selectQuestion(ci,ri){if(questionOpen||used.has(k(ci,ri))||!Q[ci]?.items[ri])return;used.add(k(ci,ri));const q=Q[ci].items[ri];current={ci,ri,cat:Q[ci].cat,value:q[0],question:q[1],accepted:q[2],answer:q[2].split('|')[0],previousChooser:chooser};questionOpen=true;answered.clear();showQuestion(current);sendAll({type:'question',cat:current.cat,value:current.value,question:current.question,seconds:20});sync();startHostTimer()}
function showQuestion(d){questionOpen=true;$('#boardWrap').classList.add('hidden');$('#questionWrap').classList.remove('hidden');$('#qMeta').textContent=d.cat+' · '+d.value;$('#qText').textContent=d.question;$('#qTimer').textContent=d.seconds||20;$('#answerInput').value='';$('#answerInput').disabled=false;$('#answerBtn').disabled=false;$('#answerMsg').textContent='';$('#answerReveal').classList.add('hidden');startLocalTimer(d.seconds||20)}
function submitAnswer(){const a=$('#answerInput').value.trim();if(!a||!questionOpen||answered.has(localId))return;answered.add(localId);$('#answerInput').disabled=true;$('#answerBtn').disabled=true;$('#answerMsg').textContent='Ответ отправлен…';if(role==='creator')processAnswer('creator',a);else hostConn.send({type:'answer',answer:a})}
function processAnswer(id,a){if(!questionOpen||answered.has('srv-'+id))return;answered.add('srv-'+id);const ok=correct(a,current.accepted);if(ok){setScore(id,getScore(id)+current.value);chooser=id;questionOpen=false;clearInterval(timerId);const payload={type:'answerResult',id,name:getName(id),correct:true,answer:current.answer,value:current.value};sendAll(payload);handleAnswerResult(payload);afterQuestion()}else{setScore(id,getScore(id)-current.value);const payload={type:'answerResult',id,name:getName(id),correct:false,value:current.value};sendAll(payload);handleAnswerResult(payload);syncScores();if(answeredPlayersCount()>=allPlayers().length)finishNoCorrect()}}
function answeredPlayersCount(){let n=0;allPlayers().forEach(p=>{if(answered.has('srv-'+p.id))n++});return n}
function handleAnswerResult(d){if(d.id===localId){$('#answerMsg').textContent=d.correct?'Правильно! +' + d.value:'Неверно. −'+d.value;$('#answerMsg').className='msg '+(d.correct?'ok':'bad')}else if(d.correct){$('#answerMsg').textContent=d.name+' ответил правильно';$('#answerMsg').className='msg ok'}if(d.correct){questionOpen=false;$('#answerInput').disabled=true;$('#answerBtn').disabled=true;$('#answerReveal').textContent='Правильный ответ: '+d.answer;$('#answerReveal').classList.remove('hidden')}}
function syncScores(){renderPlayers();sendAll({type:'scoreState',players:allPlayers(),chooser})}
function afterQuestion(){syncScores();setTimeout(()=>{const t={type:'turn',chooser,used:[...used]};sendAll(t);applyTurn(t)},1800)}function finishNoCorrect(){questionOpen=false;clearInterval(timerId);chooser=current.previousChooser;const p={type:'answerResult',id:null,name:'',correct:false,answer:current.answer,value:0,noCorrect:true};sendAll(p);$('#answerMsg').textContent='Никто не ответил правильно';$('#answerReveal').textContent='Правильный ответ: '+current.answer;$('#answerReveal').classList.remove('hidden');setTimeout(()=>{const t={type:'turn',chooser,used:[...used]};sendAll(t);applyTurn(t)},2200)}function applyTurn(d){questionOpen=false;chooser=d.chooser;$('#questionWrap').classList.add('hidden');$('#boardWrap').classList.remove('hidden');renderBoard();updateTurn();syncScores()}
function startHostTimer(){clearInterval(timerId);timeLeft=20;timerId=setInterval(()=>{timeLeft--;if(timeLeft<=0){clearInterval(timerId);if(questionOpen)finishNoCorrect()}},1000)}function startLocalTimer(sec){let t=sec;$('#qTimer').textContent=t;const id=setInterval(()=>{if(!questionOpen){clearInterval(id);return}t--;$('#qTimer').textContent=Math.max(0,t);if(t<=0)clearInterval(id)},1000)}
$('#createBtn').onclick=createRoom;$('#joinManualBtn').onclick=()=>show('join');$('#connectBtn').onclick=connect;$('#startBtn').onclick=startGame;$('#copyBtn').onclick=()=>navigator.clipboard.writeText($('#shareLink').textContent);$('#shareBtn').onclick=async()=>{const url=$('#shareLink').textContent;if(navigator.share)await navigator.share({title:'Своя игра',text:'Подключайся к игре',url});else navigator.clipboard.writeText(url)};$('#answerBtn').onclick=submitAnswer;$('#answerInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitAnswer()});if(role==='guest'){show('join');$('#roomInput').value=roomFromUrl;setNet('режим игрока')}else show('home');
</script></body></html>
