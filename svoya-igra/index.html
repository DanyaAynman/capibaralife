<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Своя игра</title><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><style>:root{--g:#ffd44d;--m:#9fb0d4;--b:#31538f;--ok:#2dd66f;--bad:#ff5a68}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#12306b,#071026 46%,#030714);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{padding:16px}.wrap{max-width:1180px;margin:auto}.brand{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.brandRight{display:flex;gap:8px;align-items:center}.logo{font-size:clamp(24px,5vw,38px);font-weight:950;letter-spacing:.08em}.logo span{color:var(--g)}.status,.tiny{font-size:13px;color:var(--m)}.soundBtn{border:1px solid #31538f;background:#102653;color:#fff;border-radius:12px;padding:9px 11px;font-weight:800}.soundBtn.on{border-color:var(--g);color:var(--g)}.card{background:linear-gradient(180deg,#10234e,#0a1837);border:1px solid #28477e;border-radius:22px;padding:22px}.hidden{display:none!important}.hero,.join,.waiting{max-width:720px;margin:7vh auto 0;text-align:center}.hero h1{font-size:clamp(38px,8vw,72px);line-height:.95}.field{width:100%;margin:8px 0;padding:15px;border-radius:14px;border:1px solid var(--b);background:#081633;color:#fff;font-size:18px}.btn{border:0;border-radius:15px;padding:13px 18px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,#2e70ff,#764cff);color:#fff}.gold{background:linear-gradient(135deg,#ffd44d,#f6a800);color:#1c1805}.ghost{background:#122653;color:#dfe8ff;border:1px solid var(--b)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.roomBox{margin:18px 0;padding:17px;border:1px dashed #5578bd;border-radius:18px;background:#07132d}.roomCode{font-size:clamp(40px,10vw,78px);font-weight:950;letter-spacing:.16em;color:var(--g)}.share{font-size:13px;color:#b7c7e7;word-break:break-all}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin:14px 0}.playerCard{padding:12px;border:1px solid var(--b);border-radius:15px;background:#0a1734}.playerCard.active{border-color:var(--g)}.score{font-size:24px;color:var(--g);font-weight:900}.turn{margin:10px 0 14px;padding:10px 14px;border-radius:13px;background:#0b1d43;border:1px solid #355995;font-weight:800}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.cat,.cell{border-radius:10px;text-align:center}.cat{background:#102858;border:1px solid #315b9f;padding:10px 3px;min-height:56px;display:flex;align-items:center;justify-content:center;font-weight:900;text-transform:uppercase;font-size:clamp(9px,1.3vw,15px)}.cell{background:linear-gradient(#103481,#0a2a70);border:1px solid #2f66c8;color:var(--g);font-weight:950;font-size:clamp(18px,3vw,34px);min-height:70px}.cell.used{opacity:.18;color:transparent;pointer-events:none}.cell.locked{opacity:.5;pointer-events:none}.questionBox{max-width:850px;margin:16px auto;text-align:center}.qMeta{color:var(--g);font-weight:900}.qText{font-size:clamp(28px,5vw,54px);font-weight:900;line-height:1.16;margin:24px 0}.timer{font-size:44px;font-weight:950;color:var(--g)}.answerRow{display:flex;gap:9px;max-width:680px;margin:16px auto}.answerRow input{flex:1;margin:0}.msg{min-height:30px;font-size:18px;font-weight:850;margin:12px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}.answerReveal{margin:14px auto;padding:14px;border-radius:14px;background:#0f2a55;border:1px solid #345f9d;max-width:700px;font-size:22px}.notice{margin-top:12px;padding:12px;border-radius:14px;background:#0b1d43;border:1px solid #355995;color:#cbd8f4}@media(max-width:760px){.app{padding:12px}.brand{align-items:flex-start}.brandRight{flex-direction:column;align-items:flex-end}.card{padding:17px}.cell{min-height:58px}.cat{min-height:48px}.answerRow{flex-direction:column}}</style></head><body><div class="app"><div class="wrap"><div class="brand"><div class="logo">СВОЯ <span>ИГРА</span></div><div class="brandRight"><button id="soundBtn" class="soundBtn" type="button">🔊 Включить звук</button><div id="netStatus" class="status">готово</div></div></div><section id="home" class="card hero"><div class="tiny">Мультиплеерная викторина</div><h1>Своя игра<br>для компании</h1><input id="creatorName" class="field" maxlength="18" placeholder="Ваше имя"><div class="row" style="justify-content:center"><button id="createBtn" class="btn gold" type="button">Создать игру</button><button id="joinManualBtn" class="btn ghost" type="button">Подключиться</button></div><div id="homeMsg" class="notice hidden"></div></section><section id="lobby" class="card hidden"><h2>Комната игры</h2><div class="roomBox"><div class="tiny">КОД КОМНАТЫ</div><div id="roomCode" class="roomCode">----</div><div id="shareLink" class="share"></div></div><div class="row"><button id="copyBtn" class="btn primary" type="button">Скопировать ссылку</button><button id="shareBtn" class="btn ghost" type="button">Поделиться</button></div><h3>Игроки</h3><div id="lobbyPlayers" class="players"></div><button id="startBtn" class="btn gold" type="button" disabled>Начать игру</button><div class="tiny" style="margin-top:10px">Первый вопрос выбирает создатель комнаты.</div></section><section id="join" class="card join hidden"><h2>Подключение к игре</h2><input id="joinName" class="field" maxlength="18" placeholder="Ваше имя"><input id="roomInput" class="field" maxlength="6" inputmode="numeric" placeholder="Код комнаты"><button id="connectBtn" class="btn primary" type="button">Подключиться</button><div id="joinMsg" class="notice">Откройте ссылку в Safari и один раз нажмите «Включить звук».</div></section><section id="waiting" class="card waiting hidden"><h2>Вы подключены</h2><p>Ждём начала игры…</p><div id="waitingPlayers" class="players"></div></section><section id="play" class="hidden"><div id="turnInfo" class="turn"></div><div id="scoreboard" class="players"></div><div id="boardWrap" class="card"><div id="board" class="board"></div></div><div id="questionWrap" class="card questionBox hidden"><div id="qMeta" class="qMeta"></div><div id="qText" class="qText"></div><div id="qTimer" class="timer">60</div><div class="answerRow"><input id="answerInput" class="field" maxlength="80" placeholder="Введите ответ"><button id="answerBtn" class="btn primary" type="button">Ответить</button></div><div id="answerMsg" class="msg"></div><div id="answerReveal" class="answerReveal hidden"></div></div></section></div></div><script>
(function(){
'use strict';
const el=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const roomParam=(params.get('room')||'').replace(/\D/g,'').slice(0,6);
const peerOpts={host:'0.peerjs.com',port:443,path:'/',secure:true,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
const questions=[
{cat:'Кино',items:[[100,'Как зовут снеговика из мультфильма «Холодное сердце»?',['Олаф']],[200,'Как зовут мальчика-волшебника со шрамом в виде молнии?',['Гарри Поттер','Гарри']],[300,'Как зовут львёнка — главного героя «Короля Льва»?',['Симба']],[400,'Как называется зелёный огр из известного мультфильма?',['Шрек']],[500,'Как зовут капитана из фильмов «Пираты Карибского моря»?',['Джек Воробей','Капитан Джек Воробей']]]},
{cat:'Животные',items:[[100,'Какое животное говорит «мяу»?',['Кошка','Кот']],[200,'Какое самое большое наземное животное?',['Слон','Африканский слон']],[300,'Как называется детёныш собаки?',['Щенок']],[400,'Какое животное носит детёныша в сумке?',['Кенгуру']],[500,'Какое животное считается самым быстрым на суше?',['Гепард']]]},
{cat:'Растения',items:[[100,'Какого цвета обычно трава летом?',['Зеленая','Зелёная','Зеленого','Зелёного']],[200,'Как называется дерево, на котором растут яблоки?',['Яблоня']],[300,'Какой цветок часто дарят 8 Марта и он бывает жёлтым, красным и розовым?',['Тюльпан']],[400,'Как называется колючее растение, которое хорошо переносит засуху?',['Кактус']],[500,'Какое дерево даёт жёлуди?',['Дуб']]]},
{cat:'География',items:[[100,'Столица России?',['Москва']],[200,'В какой стране находится Париж?',['Франция','Во Франции']],[300,'Какой океан самый большой?',['Тихий океан','Тихий']],[400,'Как называется самая высокая гора Земли?',['Эверест','Джомолунгма']],[500,'На каком материке находится Египет?',['Африка','В Африке']]]},
{cat:'Игры',items:[[100,'Как зовут водопроводчика Nintendo в красной кепке?',['Марио']],[200,'Как называется игра, где строят мир из кубиков?',['Minecraft','Майнкрафт']],[300,'Как зовут синего быстрого ежа из видеоигр?',['Соник','Sonic']],[400,'Какие существа ловят покемонов в игре и мультфильме: тренеры или роботы?',['Тренеры','Тренер']],[500,'Как называется игровая консоль компании Sony?',['PlayStation','Плейстейшн','PS']]]},
{cat:'Разное',items:[[100,'Сколько дней в неделе?',['7','Семь']],[200,'Какой цвет получится, если смешать синий и жёлтый?',['Зеленый','Зелёный']],[300,'Сколько минут в одном часе?',['60','Шестьдесят']],[400,'Как называется прибор для измерения температуры?',['Термометр']],[500,'Как называется планета, на которой мы живём?',['Земля']]]}
];
let mode=(params.get('join')==='1'||roomParam)?'guest':'creator';
let peer=null,hostConn=null,room='',localId='',localName='',chooser=null,current=null,questionOpen=false;
let players=new Map(),used=new Set(),submitted=new Set(),serverSubmitted=new Set(),hostTimer=null,localTimer=null,audioCtx=null,soundEnabled=false;
function show(id){['home','lobby','join','waiting','play'].forEach(x=>el(x).classList.add('hidden'));el(id).classList.remove('hidden')}
function status(t){el('netStatus').textContent=t}
function roomId(code){return 'svoya-'+code}
function makeRoom(){return String(Math.floor(1000+Math.random()*9000))}
function qkey(c,r){return c+'-'+r}
function clean(s){return String(s).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/gi,' ').trim()}
function isCorrect(answer,variants){const a=clean(answer);return variants.some(v=>{const b=clean(v);return a===b||(a.length>=4&&b.length>=4&&(a.includes(b)||b.includes(a)))})}
function enableSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC){el('soundBtn').textContent='Звук не поддерживается';return}if(!audioCtx)audioCtx=new AC();const ready=()=>{soundEnabled=true;el('soundBtn').textContent='🔊 Звук включен';el('soundBtn').classList.add('on');chime([523,659,784])};if(audioCtx.state==='suspended'){audioCtx.resume().then(ready).catch(()=>{})}else ready()}catch(e){}}
function tone(freq,duration,volume,delay){if(!soundEnabled||!audioCtx||audioCtx.state!=='running')return;try{const start=audioCtx.currentTime+(delay||0),o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(volume||.035,start+.01);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g);g.connect(audioCtx.destination);o.start(start);o.stop(start+duration+.02)}catch(e){}}
function chime(notes){notes.forEach((n,i)=>tone(n,.18,.045,i*.1))}
function countdownSound(t){if(!soundEnabled)return;if(t>15){if(t%2===0){tone(t%4===0?392:440,.11,.025,0);tone(523,.09,.014,.1)}}else if(t>0){tone(t<=5?880:660,.1,t<=5?.055:.04,0)}}
function getName(id){const p=players.get(id);return p?p.name:'Игрок'}
function getScore(id){const p=players.get(id);return p?p.score:0}
function setScore(id,score){const p=players.get(id);if(p)p.score=score}
function snapshot(){return Array.from(players.entries()).map(([id,p])=>({id:id,name:p.name,score:p.score}))}
function renderPlayers(){const arr=snapshot();['lobbyPlayers','waitingPlayers','scoreboard'].forEach(target=>{const box=el(target);box.innerHTML='';arr.forEach(p=>{const d=document.createElement('div');d.className='playerCard'+(p.id===chooser?' active':'');const n=document.createElement('b');n.textContent=p.name;const s=document.createElement('div');s.className='score';s.textContent=p.score;d.append(n,s);box.appendChild(d)})});if(mode==='creator')el('startBtn').disabled=arr.length<2}
function sendAll(data){players.forEach((p,id)=>{if(id!=='creator'&&p.conn&&p.conn.open){try{p.conn.send(data)}catch(e){}}})}
function sync(){renderPlayers();if(mode==='creator')sendAll({type:'state',players:snapshot(),used:Array.from(used),chooser:chooser})}
function createRoom(){localName=el('creatorName').value.trim();if(!localName){el('homeMsg').textContent='Введите имя.';el('homeMsg').classList.remove('hidden');return}room=makeRoom();localId='creator';players=new Map();players.set('creator',{name:localName,score:0});chooser='creator';el('roomCode').textContent=room;el('shareLink').textContent=location.origin+location.pathname+'?join=1&room='+room;show('lobby');renderPlayers();status('создаю комнату…');peer=new Peer(roomId(room),peerOpts);peer.on('open',()=>status('комната '+room+' онлайн'));peer.on('connection',conn=>{conn.on('data',data=>creatorData(conn,data));conn.on('close',()=>{players.delete(conn.peer);sync()})});peer.on('error',e=>status('ошибка: '+(e.type||'network')))}
function creatorData(conn,data){if(!data||!data.type)return;if(data.type==='hello'){players.set(conn.peer,{name:(data.name||'Игрок').slice(0,18),score:0,conn:conn});conn.send({type:'welcome'});sync();return}if(data.type==='select'&&chooser===conn.peer&&!questionOpen){selectQuestion(Number(data.ci),Number(data.ri));return}if(data.type==='answer')processAnswer(conn.peer,data.answer)}
function connect(){localName=el('joinName').value.trim();room=(el('roomInput').value||roomParam).replace(/\D/g,'').slice(0,6);if(!localName||!room){el('joinMsg').textContent='Введите имя и код комнаты.';return}el('joinMsg').textContent='Подключение…';peer=new Peer(undefined,peerOpts);peer.on('open',()=>{localId=peer.id;hostConn=peer.connect(roomId(room),{reliable:true});hostConn.on('open',()=>hostConn.send({type:'hello',name:localName}));hostConn.on('data',guestData)});peer.on('error',e=>el('joinMsg').textContent='Ошибка: '+(e.type||'network'))}
function guestData(data){if(!data||!data.type)return;if(data.type==='welcome'){show('waiting');status('подключено к комнате '+room)}else if(data.type==='state'){players=new Map(data.players.map(p=>[p.id,{name:p.name,score:p.score}]));used=new Set(data.used||[]);chooser=data.chooser;renderPlayers();renderBoard()}else if(data.type==='gameStart'){show('play');chooser=data.chooser;used=new Set(data.used||[]);renderBoard();updateTurn()}else if(data.type==='question'){showQuestion(data)}else if(data.type==='answerResult'){handleResult(data)}else if(data.type==='turn'){questionOpen=false;chooser=data.chooser;used=new Set(data.used||[]);el('questionWrap').classList.add('hidden');el('boardWrap').classList.remove('hidden');renderBoard();updateTurn()}else if(data.type==='scores'){players=new Map(data.players.map(p=>[p.id,{name:p.name,score:p.score}]));chooser=data.chooser;renderPlayers()}}
function startGame(){show('play');chooser='creator';renderBoard();updateTurn();sendAll({type:'gameStart',chooser:chooser,used:Array.from(used)});sync()}
function renderBoard(){const board=el('board');board.innerHTML='';questions.forEach(c=>{const h=document.createElement('div');h.className='cat';h.textContent=c.cat;board.appendChild(h)});for(let r=0;r<5;r++){questions.forEach((c,ci)=>{const b=document.createElement('button');b.type='button';const can=localId===chooser&&!questionOpen;b.className='cell'+(used.has(qkey(ci,r))?' used':(!can?' locked':''));b.textContent=c.items[r][0];b.addEventListener('click',()=>{if(!can||used.has(qkey(ci,r)))return;if(mode==='creator')selectQuestion(ci,r);else hostConn.send({type:'select',ci:ci,ri:r})});board.appendChild(b)})}}
function updateTurn(){el('turnInfo').textContent=localId===chooser?'Ваш ход — выберите следующий вопрос':'Сейчас выбирает '+getName(chooser);renderPlayers()}
function selectQuestion(ci,ri){if(questionOpen||!questions[ci]||!questions[ci].items[ri]||used.has(qkey(ci,ri)))return;used.add(qkey(ci,ri));const q=questions[ci].items[ri];current={cat:questions[ci].cat,value:q[0],question:q[1],variants:q[2],answer:q[2][0],previousChooser:chooser};questionOpen=true;submitted.clear();serverSubmitted.clear();showQuestion({cat:current.cat,value:current.value,question:current.question,seconds:60});sendAll({type:'question',cat:current.cat,value:current.value,question:current.question,seconds:60});sync();startHostTimer()}
function showQuestion(data){questionOpen=true;submitted.clear();clearInterval(localTimer);el('boardWrap').classList.add('hidden');el('questionWrap').classList.remove('hidden');el('qMeta').textContent=data.cat+' · '+data.value;el('qText').textContent=data.question;el('answerInput').value='';el('answerInput').disabled=false;el('answerBtn').disabled=false;el('answerMsg').textContent='';el('answerMsg').className='msg';el('answerReveal').classList.add('hidden');chime([440,554,659]);startLocalTimer(data.seconds||60)}
function submitAnswer(){const a=el('answerInput').value.trim();if(!a||!questionOpen||submitted.has(localId))return;submitted.add(localId);el('answerInput').disabled=true;el('answerBtn').disabled=true;el('answerMsg').textContent='Ответ отправлен…';if(mode==='creator')processAnswer('creator',a);else hostConn.send({type:'answer',answer:a})}
function processAnswer(id,answer){if(!questionOpen||serverSubmitted.has(id))return;serverSubmitted.add(id);const ok=isCorrect(answer,current.variants);setScore(id,getScore(id)+(ok?current.value:-current.value));if(ok){chooser=id;questionOpen=false;clearInterval(hostTimer);const result={type:'answerResult',id:id,name:getName(id),correct:true,value:current.value,answer:current.answer};sendAll(result);handleResult(result);syncScores();chime([659,784,988]);setTimeout(nextTurn,1800)}else{const result={type:'answerResult',id:id,name:getName(id),correct:false,value:current.value};sendAll(result);handleResult(result);syncScores();if(serverSubmitted.size>=players.size)finishNoCorrect()}}
function handleResult(data){if(data.id===localId){el('answerMsg').textContent=data.correct?'Правильно! +'+data.value:'Неверно. −'+data.value;el('answerMsg').className='msg '+(data.correct?'ok':'bad')}else if(data.correct){el('answerMsg').textContent=data.name+' ответил правильно';el('answerMsg').className='msg ok'}if(data.correct){questionOpen=false;clearInterval(localTimer);el('answerInput').disabled=true;el('answerBtn').disabled=true;el('answerReveal').textContent='Правильный ответ: '+data.answer;el('answerReveal').classList.remove('hidden')}}
function syncScores(){renderPlayers();sendAll({type:'scores',players:snapshot(),chooser:chooser})}
function nextTurn(){const data={type:'turn',chooser:chooser,used:Array.from(used)};sendAll(data);applyTurn(data)}
function finishNoCorrect(){if(!questionOpen)return;questionOpen=false;clearInterval(hostTimer);clearInterval(localTimer);chooser=current.previousChooser;el('answerMsg').textContent='Никто не ответил правильно';el('answerReveal').textContent='Правильный ответ: '+current.answer;el('answerReveal').classList.remove('hidden');sendAll({type:'answerResult',id:null,correct:false,answer:current.answer,value:0});setTimeout(nextTurn,2200)}
function applyTurn(data){questionOpen=false;submitted.clear();serverSubmitted.clear();chooser=data.chooser;el('questionWrap').classList.add('hidden');el('boardWrap').classList.remove('hidden');renderBoard();updateTurn();syncScores()}
function startHostTimer(){clearInterval(hostTimer);let t=60;hostTimer=setInterval(()=>{t--;if(t<=0){clearInterval(hostTimer);finishNoCorrect()}},1000)}
function startLocalTimer(seconds){clearInterval(localTimer);let t=seconds;el('qTimer').textContent=t;countdownSound(t);localTimer=setInterval(()=>{if(!questionOpen){clearInterval(localTimer);return}t--;el('qTimer').textContent=Math.max(0,t);countdownSound(t);if(t<=0)clearInterval(localTimer)},1000)}
el('soundBtn').addEventListener('click',enableSound);el('createBtn').addEventListener('click',createRoom);el('joinManualBtn').addEventListener('click',()=>show('join'));el('connectBtn').addEventListener('click',connect);el('startBtn').addEventListener('click',startGame);el('copyBtn').addEventListener('click',()=>navigator.clipboard&&navigator.clipboard.writeText(el('shareLink').textContent));el('shareBtn').addEventListener('click',async()=>{const url=el('shareLink').textContent;if(navigator.share)await navigator.share({title:'Своя игра',text:'Подключайся к игре',url:url})});el('answerBtn').addEventListener('click',submitAnswer);el('answerInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitAnswer()});
if(mode==='guest'){show('join');el('roomInput').value=roomParam;status('режим игрока')}else{show('home');status('готово')}
})();
</script></body></html>
