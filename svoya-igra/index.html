<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Своя игра</title><style>
:root{--g:#ffd44d;--m:#9fb0d4;--b:#31538f;--ok:#2dd66f;--bad:#ff5a68}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#12306b,#071026 46%,#030714);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{padding:16px}.wrap{max-width:1180px;margin:auto}.brand{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.brandRight{display:flex;gap:8px;align-items:center}.logo{font-size:clamp(24px,5vw,38px);font-weight:950;letter-spacing:.08em}.logo span{color:var(--g)}.status,.tiny{font-size:13px;color:var(--m)}.soundBtn{border:1px solid #31538f;background:#102653;color:#fff;border-radius:12px;padding:9px 11px;font-weight:800}.soundBtn.on{border-color:var(--g);color:var(--g)}.card{background:linear-gradient(180deg,#10234e,#0a1837);border:1px solid #28477e;border-radius:22px;padding:22px}.hidden{display:none!important}.hero,.join,.waiting,.final{max-width:720px;margin:7vh auto 0;text-align:center}.hero h1,.final h1{font-size:clamp(38px,8vw,72px);line-height:.95}.field{width:100%;margin:8px 0;padding:15px;border-radius:14px;border:1px solid var(--b);background:#081633;color:#fff;font-size:18px}.btn{border:0;border-radius:15px;padding:13px 18px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,#2e70ff,#764cff);color:#fff}.gold{background:linear-gradient(135deg,#ffd44d,#f6a800);color:#1c1805}.ghost{background:#122653;color:#dfe8ff;border:1px solid var(--b)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.roomBox{margin:18px 0;padding:17px;border:1px dashed #5578bd;border-radius:18px;background:#07132d}.roomCode{font-size:clamp(40px,10vw,78px);font-weight:950;letter-spacing:.12em;color:var(--g)}.share{font-size:13px;color:#b7c7e7;word-break:break-all}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin:14px 0}.playerCard{padding:12px;border:1px solid var(--b);border-radius:15px;background:#0a1734}.playerCard.active{border-color:var(--g)}.score{font-size:24px;color:var(--g);font-weight:900}.turn{margin:10px 0 14px;padding:10px 14px;border-radius:13px;background:#0b1d43;border:1px solid #355995;font-weight:800}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.cat,.cell{border-radius:10px;text-align:center}.cat{background:#102858;border:1px solid #315b9f;padding:10px 3px;min-height:56px;display:flex;align-items:center;justify-content:center;font-weight:900;text-transform:uppercase;font-size:clamp(9px,1.3vw,15px)}.cell{background:linear-gradient(#103481,#0a2a70);border:1px solid #2f66c8;color:var(--g);font-weight:950;font-size:clamp(18px,3vw,34px);min-height:70px}.cell.used{opacity:.18;color:transparent;pointer-events:none}.cell.locked{opacity:.5;pointer-events:none}.questionBox{max-width:850px;margin:16px auto;text-align:center}.qMeta{color:var(--g);font-weight:900}.qVisual{font-size:clamp(72px,18vw,150px);line-height:1;margin:18px 0}.qText{font-size:clamp(28px,5vw,54px);font-weight:900;line-height:1.16;margin:24px 0}.timer{font-size:44px;font-weight:950;color:var(--g)}.answerRow{display:flex;gap:9px;max-width:680px;margin:16px auto}.answerRow input{flex:1;margin:0}.msg{min-height:30px;font-size:18px;font-weight:850;margin:12px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}.answerReveal,.notice{margin:14px auto;padding:14px;border-radius:14px;background:#0f2a55;border:1px solid #345f9d;max-width:700px}.winnerName{font-size:clamp(34px,9vw,70px);font-weight:950;color:var(--g);margin:18px 0}.finalScore{font-size:28px;font-weight:900}.podium{display:grid;gap:10px;margin-top:22px}.podiumRow{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border:1px solid #31538f;border-radius:14px;background:#0a1734;font-weight:800}@media(max-width:760px){.app{padding:12px}.brand{align-items:flex-start}.brandRight{flex-direction:column;align-items:flex-end}.card{padding:17px}.cell{min-height:58px}.cat{min-height:48px}.answerRow{flex-direction:column}}
</style></head><body><div class="app"><div class="wrap"><div class="brand"><div class="logo">СВОЯ <span>ИГРА</span></div><div class="brandRight"><button id="soundBtn" class="soundBtn" type="button">🔊 Включить звук</button><div id="netStatus" class="status">Supabase Realtime v12</div></div></div>
<section id="home" class="card hero"><div class="tiny">Мультиплеерная викторина · Realtime v12</div><h1>Своя игра<br>для компании</h1><input id="creatorName" class="field" maxlength="18" placeholder="Ваше имя"><div class="row" style="justify-content:center"><button id="createBtn" class="btn gold" type="button">Создать игру</button><button id="joinManualBtn" class="btn ghost" type="button">Подключиться</button></div><div id="homeMsg" class="notice hidden"></div></section>
<section id="lobby" class="card hidden"><h2>Комната игры</h2><div class="roomBox"><div class="tiny">6-ЗНАЧНЫЙ КОД КОМНАТЫ</div><div id="roomCode" class="roomCode">------</div><div id="shareLink" class="share"></div></div><div class="row"><button id="copyBtn" class="btn primary" type="button">Скопировать ссылку</button><button id="shareBtn" class="btn ghost" type="button">Поделиться</button></div><div id="hostMsg" class="notice hidden"></div><h3>Игроки</h3><div id="playerCounter" class="tiny">1 / 8 игроков</div><div id="lobbyPlayers" class="players"></div><button id="startBtn" class="btn gold" type="button" disabled>Начать игру</button></section>
<section id="join" class="card join hidden"><h2>Подключение к игре</h2><input id="joinName" class="field" maxlength="18" placeholder="Ваше имя"><input id="roomInput" class="field" maxlength="6" inputmode="numeric" placeholder="6-значный код комнаты"><button id="connectBtn" class="btn primary" type="button">Подключиться</button><div id="joinMsg" class="notice">Подключение через Supabase Realtime.</div></section>
<section id="waiting" class="card waiting hidden"><h2>Вы подключены</h2><p>Ждём начала игры…</p><div id="waitingPlayers" class="players"></div></section>
<section id="play" class="hidden"><div id="turnInfo" class="turn"></div><div id="scoreboard" class="players"></div><div id="boardWrap" class="card"><div id="board" class="board"></div></div><div id="questionWrap" class="card questionBox hidden"><div id="qMeta" class="qMeta"></div><div id="qVisual" class="qVisual hidden"></div><div id="qText" class="qText"></div><div id="qTimer" class="timer">30</div><div class="answerRow"><input id="answerInput" class="field" maxlength="80" placeholder="Введите ответ"><button id="answerBtn" class="btn primary" type="button">Ответить</button></div><div id="answerMsg" class="msg"></div><div id="answerReveal" class="answerReveal hidden"></div></div></section>
<section id="final" class="card final hidden"><div class="tiny">ИГРА ОКОНЧЕНА</div><h1>🎉 Финал!</h1><div id="winnerLabel" class="tiny">Победитель</div><div id="winnerName" class="winnerName"></div><div id="winnerScore" class="finalScore"></div><div id="podium" class="podium"></div></section>
</div></div><script src="network-realtime-v11.js?v=20260830-11"></script><script src="ui-v12.js?v=20260830-12"></script></body></html>
